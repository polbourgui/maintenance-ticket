name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Migrations are in sync with models
        env:
          APP_DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head && alembic check && alembic downgrade base
